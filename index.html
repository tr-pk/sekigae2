<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>席替え</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+JP:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0f;
            --surface: #12121a;
            --surface2: #1a1a26;
            --border: #2a2a3e;
            --accent: #7c6aff;
            --accent2: #ff6a6a;
            --text: #e0e0f0;
            --muted: #555570;
            --success: #6affb0;
            }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Noto Sans JP', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        header { width: 100%; max-width: 900px; padding: 20px 0 10px; display: flex; align-items: baseline; gap: 12px; border-bottom: 1px solid var(--border); margin-bottom: 30px; }
        .title { font-family: 'Bebas Neue', sans-serif; font-size: 2.5rem; color: var(--accent); letter-spacing: 4px; }
        .subtitle { font-size: 0.75rem; color: var(--muted); letter-spacing: 2px; }
        .setup-card { width: 100%; max-width: 900px; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 28px; margin-bottom: 24px; }
        .section-label { font-size: 0.7rem; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; margin-bottom: 12px; }
        .setup-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 24px; }
        .input-group { display: flex; flex-direction: column; gap: 8px; }
        .input-label { font-size: 0.7rem; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; }
        .input-field { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 12px 16px; color: var(--text); font-size: 1.1rem; font-family: 'Bebas Neue', sans-serif; letter-spacing: 2px; outline: none; transition: border-color 0.2s; width: 100%; }
        .input-field:focus { border-color: var(--accent); }
        .info-bar { display: flex; gap: 20px; padding: 12px 16px; background: var(--surface2); border-radius: 8px; margin-bottom: 20px; font-size: 0.8rem; color: var(--muted); }
        .info-bar span { color: var(--text); font-weight: 700; }
        .divider { border: none; border-top: 1px solid var(--border); margin: 20px 0; }
        .fixed-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
        .fixed-row { display: flex; align-items: center; gap: 8px; }
        .fixed-row .input-field { width: 70px; flex-shrink: 0; text-align: center; }
        .fixed-label { font-size: 0.75rem; color: var(--muted); white-space: nowrap; }
        .btn-icon { width: 32px; height: 32px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface2); color: var(--text); font-size: 1.1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.15s; flex-shrink: 0; }
        .btn-icon:hover { border-color: var(--accent); color: var(--accent); }
        .btn-icon.remove:hover { border-color: var(--accent2); color: var(--accent2); }
        .btn-add { display: flex; align-items: center; gap: 6px; background: none; border: 1px dashed var(--border); border-radius: 8px; padding: 8px 14px; color: var(--muted); font-size: 0.8rem; cursor: pointer; transition: all 0.15s; letter-spacing: 1px; }
        .btn-add:hover { border-color: var(--accent); color: var(--accent); }
        .btn-generate { width: 100%; padding: 16px; background: var(--accent); border: none; border-radius: 10px; color: #fff; font-family: 'Bebas Neue', sans-serif; font-size: 1.3rem; letter-spacing: 4px; cursor: pointer; transition: all 0.2s; margin-top: 20px; }
        .btn-generate:hover { filter: brightness(1.2); transform: translateY(-1px); }
        .btn-generate:disabled { opacity: 0.5; cursor: not-allowed; transform: none; filter: none; }
        .classroom-wrap { width: 100%; max-width: 900px; display: none; }
        .classroom-wrap.visible { display: block; }
        .blackboard { background: #1a2e1a; border: 2px solid #2d4d2d; border-radius: 8px; padding: 14px; text-align: center; margin-bottom: 8px; font-family: 'Bebas Neue', sans-serif; font-size: 1.1rem; letter-spacing: 6px; color: #6aff9a; text-shadow: 0 0 20px rgba(106,255,154,0.4); }
        .teacher-desk { background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; padding: 8px; text-align: center; margin-bottom: 24px; font-size: 0.7rem; letter-spacing: 3px; color: var(--muted); }
        .seat-grid { display: grid; gap: 8px; margin-bottom: 20px; }
        .seat { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 10px 6px; text-align: center; cursor: grab; transition: border-color 0.15s, transform 0.15s, box-shadow 0.15s; user-select: none; min-height: 56px; display: flex; align-items: center; justify-content: center; font-family: 'Bebas Neue', sans-serif; font-size: 1.1rem; letter-spacing: 1px; }
        .seat:hover { border-color: var(--accent); transform: scale(1.04); z-index: 2; }
        .seat.dragging { opacity: 0.4; transform: scale(0.95); }
        .seat.drag-over { border-color: var(--accent); background: var(--surface2); box-shadow: 0 0 12px rgba(124,106,255,0.4); }
        .seat.rolling { color: var(--accent); border-color: var(--accent); box-shadow: 0 0 8px rgba(124,106,255,0.3); cursor: default; font-size: 1.3rem; }
        
        
        
        .seat { position: relative; }
        .seat.empty { background: transparent; border-style: dashed; border-color: #222233; color: var(--muted); font-size: 0.6rem; letter-spacing: 2px; cursor: default; }
        .seat.empty:hover { transform: none; border-color: #222233; }
        .btn-reshuffle { width: 100%; padding: 14px; background: var(--surface); border: 1px solid var(--accent); border-radius: 10px; color: var(--accent); font-family: 'Bebas Neue', sans-serif; font-size: 1.1rem; letter-spacing: 4px; cursor: pointer; transition: all 0.2s; margin-bottom: 8px; }
        .btn-reshuffle:hover { background: var(--accent); color: #fff; }
        .btn-reshuffle:disabled { opacity: 0.4; cursor: not-allowed; }
        .drag-hint { text-align: center; font-size: 0.7rem; color: var(--muted); letter-spacing: 2px; margin-bottom: 20px; }
        .legend { display: flex; gap: 16px; margin-bottom: 16px; font-size: 0.75rem; color: var(--muted); }
        .legend-item { display: flex; align-items: center; gap: 6px; }
        .legend-dot { width: 10px; height: 10px; border-radius: 2px; }
            .seat.selected {
            border-color: var(--accent) !important;
            animation: pulse-select 0.8s ease-in-out infinite;
            box-shadow: 0 0 20px rgba(124,106,255,0.8) !important;
        }
        @keyframes pulse-select {
            0%, 100% { box-shadow: 0 0 10px rgba(124,106,255,0.4); }
            50% { box-shadow: 0 0 30px rgba(124,106,255,1); }
        }
        .seat.swapping {
            animation: swap-flash 0.3s ease-in-out;
        }
        @keyframes swap-flash {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); background: var(--accent); color: #000; }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>
<header>
    <div class="title">席替え</div>
    <div class="subtitle">SEAT SHUFFLE GENERATOR</div>
</header>
<div class="setup-card">
    <div class="section-label">基本設定</div>
    <div class="setup-grid">
        <div class="input-group">
            <div class="input-label">列数（横）</div>
            <input class="input-field" type="number" id="cols" value="6" min="1" max="12" oninput="updateInfo()">
        </div>
        <div class="input-group">
            <div class="input-label">行数（縦）</div>
            <input class="input-field" type="number" id="rows" value="5" min="1" max="12" oninput="updateInfo()">
        </div>
        <div class="input-group">
            <div class="input-label">最初の番号</div>
            <input class="input-field" type="number" id="numStart" value="1" min="1" oninput="updateInfo()">
        </div>
        <div class="input-group">
            <div class="input-label">最後の番号</div>
            <input class="input-field" type="number" id="numEnd" value="30" min="1" oninput="updateInfo()">
        </div>
    </div>
    <div class="info-bar">
        <div>総席数：<span id="info-total">30</span></div>
        <div>生徒数：<span id="info-students">30</span></div>
        <div>空席数：<span id="info-empty">0</span></div>
    </div>
    <hr class="divider">
    <div class="section-label">固定席設定（任意）</div>
    <div class="fixed-list" id="fixed-list"></div>
    <button class="btn-add" onclick="addFixedRow()">＋ 固定席を追加</button>
    <button class="btn-generate" id="btn-generate" onclick="generate()">席替えスタート</button>
</div>

<div class="classroom-wrap" id="classroom">
    <div class="legend">
        <div class="legend-item"><div class="legend-dot" style="background:var(--fixed);"></div>固定席</div>
    </div>
    <div class="blackboard">⬛ 黒板 ⬛</div>
    <div class="teacher-desk">教卓</div>
    <div class="seat-grid" id="seat-grid"></div>
    <div class="drag-hint" id="drag-hint" style="display:none;">✦ タップで席を選択、もう一度タップで入れ替え</div>
    <button class="btn-reshuffle" id="btn-reshuffle" onclick="generate()" disabled>もう一度シャッフル</button>
</div>

<script>
var isAnimating = false;

function updateInfo() {
    var cols = parseInt(document.getElementById('cols').value) || 0;
    var rows = parseInt(document.getElementById('rows').value) || 0;
    var start = parseInt(document.getElementById('numStart').value) || 0;
    var end = parseInt(document.getElementById('numEnd').value) || 0;
    var total = cols * rows;
    var students = Math.max(0, end - start + 1);
    var empty = Math.max(0, total - students);
    document.getElementById('info-total').innerText = total;
    document.getElementById('info-students').innerText = students;
    document.getElementById('info-empty').innerText = empty;
}

function addFixedRow() {
    var list = document.getElementById('fixed-list');
    var row = document.createElement('div');
    row.className = 'fixed-row';
    row.innerHTML = '<span class="fixed-label">番号</span><input class="input-field" type="number" placeholder="" min="1" style="width:70px;"><span class="fixed-label">→</span><span class="fixed-label">列</span><input class="input-field" type="number" placeholder="" min="1" style="width:70px;"><span class="fixed-label">行</span><input class="input-field" type="number" placeholder="" min="1" style="width:70px;"><button class="btn-icon remove" onclick="this.parentElement.remove()">－</button>';
    list.appendChild(row);
}

function getFixedSeats(cols) {
    var fixed = {};
    var rows = document.querySelectorAll('#fixed-list .fixed-row');
    rows.forEach(function(row) {
        var inputs = row.querySelectorAll('input');
        var num = parseInt(inputs[0].value);
        var c = parseInt(inputs[1].value);
        var r = parseInt(inputs[2].value);
        if (num && r && c) {
            var idx = (r - 1) * cols + (c - 1);
            fixed[idx] = num;
        }
    });
    return fixed;
}

function shuffle(arr) {
    for (var i = arr.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
    }
    return arr;
}

function generate() {
    if (isAnimating) return;
    var cols = parseInt(document.getElementById('cols').value);
    var rows = parseInt(document.getElementById('rows').value);
    var start = parseInt(document.getElementById('numStart').value);
    var end = parseInt(document.getElementById('numEnd').value);
    if (!cols || !rows || !start || !end || start > end) return;
    document.getElementById('classroom').classList.add('visible');
    setTimeout(function(){ document.getElementById('seat-grid').scrollIntoView({ behavior: 'smooth' }); }, 50);

    var total = cols * rows;
    var fixedSeats = getFixedSeats(cols);
    var fixedNums = Object.values(fixedSeats);

    var students = [];
    for (var i = start; i <= end; i++) {
        if (fixedNums.indexOf(i) === -1) students.push(i);
    }
    shuffle(students);

    var finalArr = [];
    var si = 0;
    for (var i = 0; i < total; i++) {
        if (fixedSeats[i] !== undefined) {
            finalArr.push({ num: fixedSeats[i], fixed: true });
        } else if (si < students.length) {
            finalArr.push({ num: students[si++], fixed: false });
        } else {
            finalArr.push({ num: null, fixed: false });
        }
    }

    var grid = document.getElementById('seat-grid');
    grid.style.gridTemplateColumns = 'repeat(' + cols + ', 1fr)';
    grid.innerHTML = '';
    document.getElementById('classroom').classList.add('visible');
    
    document.getElementById('drag-hint').style.display = 'none';
    document.getElementById('btn-reshuffle').disabled = true;
    document.getElementById('btn-generate').disabled = true;
    document.getElementById('btn-generate').innerText = 'シャッフル中...';
    isAnimating = true;

    var allNums = [];
    for (var i = start; i <= end; i++) allNums.push(i);

    var seats = [];
    for (var i = 0; i < total; i++) {
        var seat = document.createElement('div');
        var item = finalArr[i];
        if (item.num === null) {
            seat.className = 'seat empty';
            seat.innerText = '空席';
        } else {
            seat.className = 'seat rolling';
            seat.innerText = '?';
            seat.dataset.final = item.num;
            seat.dataset.fixed = item.fixed ? '1' : '0';
        }
        grid.appendChild(seat);
        seats.push(seat);
    }

    // ぐるぐるフェーズ（3秒）
    var rollDuration = 3000;
    var activeSeat = seats.filter(function(s) { return !s.classList.contains('empty'); });

    var rollers = activeSeat.map(function(seat) {
        var interval = setInterval(function() {
            seat.innerText = allNums[Math.floor(Math.random() * allNums.length)];
        }, 60);
        return { seat: seat, interval: interval };
    });

    // 3秒後に一斉にドン！
    setTimeout(function() {
        rollers.forEach(function(r) {
            clearInterval(r.interval);
        });

        // 全席同時にピカッと光らせてから確定
        activeSeat.forEach(function(seat) {
            seat.style.transition = 'all 0.1s';
            seat.style.transform = 'scale(1.15)';
            seat.style.boxShadow = '0 0 20px rgba(124,106,255,0.8)';
        });

        setTimeout(function() {
            activeSeat.forEach(function(seat) {
                seat.innerText = seat.dataset.final;
                seat.style.transform = 'scale(1)';
                seat.style.boxShadow = '';

                if (seat.dataset.fixed === '1') {
                    seat.className = 'seat';
                    seat.addEventListener('click', onSeatTap);
                } else {
                    seat.className = 'seat';
                    seat.addEventListener('click', onSeatTap);
                }
            });

            isAnimating = false;
            document.getElementById('drag-hint').style.display = 'block';
            document.getElementById('btn-reshuffle').disabled = false;
            document.getElementById('btn-generate').disabled = false;
            document.getElementById('btn-generate').innerText = '席替えスタート';
        }, 150);
    }, rollDuration);
}

var selectedSeat = null;

function onSeatTap() {
    if (this.classList.contains('empty')) return;

    if (selectedSeat === null) {
        selectedSeat = this;
        this.classList.add('selected');
    } else if (selectedSeat === this) {
        this.classList.remove('selected');
        selectedSeat = null;
    } else {
        var a = selectedSeat;
        var b = this;
        var tmpText = a.innerText;
        a.innerText = b.innerText;
        b.innerText = tmpText;
        a.classList.remove('selected');
        a.classList.add('swapping');
        b.classList.add('swapping');
        setTimeout(function() {
            a.classList.remove('swapping');
            b.classList.remove('swapping');
        }, 300);
        selectedSeat = null;
    }
}

updateInfo();
</script>
</body>
</html>
